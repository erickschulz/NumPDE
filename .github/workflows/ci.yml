name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  HUNTER_ROOT: ${{ github.workspace }}/hunter

jobs:
  # Format check disabled - can be re-enabled later if needed
  # format:
  #   name: clang-format-18
  #   runs-on: ubuntu-22.04
  #   steps:
  #   - uses: actions/checkout@v4
