name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - name: Install clang-format-18
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
        sudo apt-get update
        sudo apt-get install -y clang-format-18
    - name: Check formatting
      run: |
        echo "Checking if the code is well formatted"
        clang-format-18 --version
        echo "Checking developers folder"
        ./scripts/ci/run-clang-format.py -r --clang-format-executable clang-format-18 --color always developers/
        echo "Checking include folder"
        ./scripts/ci/run-clang-format.py -r --clang-format-executable clang-format-18 --color always include/
        echo "Checking lecturecodes folder"
        ./scripts/ci/run-clang-format.py -r --clang-format-executable clang-format-18 --color always lecturecodes/

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            compiler: g++
            cxxflags: "-Werror=cpp"
          - os: macos-latest
            compiler: clang++
            cxxflags: "-Werror=#warnings"
    steps:
    - uses: actions/checkout@v3

    - name: Cache Hunter
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/hunter
        key: hunter-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          hunter-${{ runner.os }}-

    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.os }}-

    - name: Install build dependencies
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y ccache
        else
          brew install ccache
        fi

    - name: Install Python dependencies
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          python3 -m pip install --upgrade pip
          pip3 install matplotlib numpy
        else
          # macOS: use --break-system-packages or brew
          python3 -m pip install --break-system-packages matplotlib numpy
        fi

    - name: Setup ccache
      run: |
        ccache --set-config=max_size=500M
        ccache --set-config=compression=true
        ccache -z

    - name: Get Dependencies
      run: |
        mkdir -p build
        cd build
        export CXX=${{ matrix.compiler }}
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake -DHOMEWORKS=OFF -DCMAKE_BUILD_TYPE=Release -DHUNTER_CONFIGURATION_TYPES=Release -Wdev -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.cxxflags }}" ..

    - name: Build
      run: |
        cd build
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        make -j $(nproc)
        ccache -s

    - name: Test
      run: |
        cd build
        echo "Testing developer folder master solutions"
        ../scripts/ci/test_developers.sh
        echo "Testing lecture codes"
        ../scripts/ci/run_lecturecodes.sh

  tidy:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - name: Install clang-tidy-18
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
        sudo apt-get update
        sudo apt-get install -y clang-tidy-18

    - name: Cache Hunter
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/hunter
        key: hunter-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          hunter-${{ runner.os }}-

    - name: Run tidy
      run: |
        mkdir -p build
        cd build
        cmake -DHOMEWORKS=OFF -DCMAKE_BUILD_TYPE=Release -DHUNTER_CONFIGURATION_TYPES=Release -Wdev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMYSOLUTION=OFF ..
        echo "Running clang-tidy on developers folder"
        clang-tidy-18 --version
        ../scripts/ci/run-clang-tidy.py -clang-tidy-binary clang-tidy-18 -p . -config-file ../.clang-tidy "../developers/.*\\.cc"
        echo "Checking if std::system is used in developers folder"
        ../scripts/ci/forbid_stdsystem.sh ../developers/
        echo "Running clang-tidy on lecturecodes folder"
        ../scripts/ci/run-clang-tidy.py -clang-tidy-binary clang-tidy-18 -p . -config-file ../.clang-tidy "../lecturecodes/.*\\.cc"
